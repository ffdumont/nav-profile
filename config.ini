[PATHS]
# Database configuration
database_folder = data
database_filename = airspaces.db

# Input data configuration  
input_data_folder = data/input
aixm_filename = AIXM4.5_all_FR_OM_2025-10-02.xml
sample_profile = LFXU-LFFY-sample.kml

# Output data configuration
output_data_folder = data/output
temp_folder = data/temp

# Sample data configuration
sample_data_folder = data/samples

[APPLICATION]
# Application configuration
app_name = AirCheck
version = 1.2.5
splash_timeout = 3000
enable_splash = true

# Performance settings
preload_database = true
cache_airspace_data = true

[LOGGING]
# Logging configuration
log_level = INFO
log_folder = data/logs
max_log_size = 10MB
backup_count = 5

[PROCESSING]
# Default processing parameters
default_climb_rate = 500
default_descent_rate = 500
default_cruise_altitude = 3000